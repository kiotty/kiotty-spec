name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: |
          if [ -d build/Debug ]; then bin=build/Debug; ext=.exe; else bin=build; ext=; fi
          for test in core datasource cursor_pool model cli api query rule_sync system e2e; do
            echo "::group::kiotty_${test}_test"
            "$bin/kiotty_${test}_test$ext"
            echo "::endgroup::"
          done
          echo "::group::kiotty_ks_scenario_test"
          "$bin/kiotty_ks_scenario_test$ext" "$bin/ks$ext"
          echo "::endgroup::"
          echo "::group::kiotty_viewer_bridge_test"
          "$bin/kiotty_viewer_bridge_test$ext"
          echo "::endgroup::"

  # wasm32 (CR-019, DSN-127): 라이브러리 · 뷰어 다리 · 테스트를 emscripten 으로 빌드하고 Node.js 로 돌린다. 경고는 오류다.
  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release -DKIOTTY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-wasm --parallel

      - name: Test
        run: |
          for test in core datasource cursor_pool model cli api query rule_sync system e2e viewer_bridge; do
            echo "::group::kiotty_${test}_test"
            node "build-wasm/kiotty_${test}_test.js"
            echo "::endgroup::"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Viewer JS tests
        run: KIOTTY_VIEWER_JS=build-wasm/app/viewer/wasm/viewer.js node --test "tests/viewer/web/*.test.mjs"

      - name: Keep viewer.wasm
        uses: actions/upload-artifact@v4
        with:
          name: viewer-wasm
          path: |
            build-wasm/app/viewer/wasm/viewer.js
            build-wasm/app/viewer/wasm/viewer.wasm

  # GitHub Pages (CR-019, DSN-127, REQ-059): 태그를 푸시하면 wasm32 잡이 통과한 뒤 뷰어를 배포한다.
  # 저장소 설정 Pages 의 Source 를 "GitHub Actions" 로 두어야 한다.
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wasm32]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: viewer-wasm
          path: viewer-wasm

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r app/viewer/web/. site/
          cp viewer-wasm/viewer.js viewer-wasm/viewer.wasm site/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
