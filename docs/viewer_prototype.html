<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kiotty-spec 뷰어 (프로토타입)</title>
<!-- 생성 파일: node tools/ui_prototype/build.js. 화면 명세 · 모델 · 안내 글은 ks 에서, 프로젝트 데이터는 dummy.json 에서 온다. 직접 고치지 않는다. -->
<style>
:root {
  --fg: #1c2330; --muted: #5d6878; --line: #dde2e8; --bg: #f5f7fa; --card: #fff;
  --accent: #2f6fde; --accent-bg: #e8f0ff; --ok: #1b7f4b; --ok-bg: #e5f5ec;
  --warn: #b3261e; --warn-bg: #fdecea; --amber: #8a5a00; --amber-bg: #fff3d6;
  --radius: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
}
@media (prefers-color-scheme: dark) {
  :root { --fg: #e6e9ee; --muted: #9aa5b4; --line: #2c3440; --bg: #12161c; --card: #1a2029; --accent: #6ea0ff; --accent-bg: #1d2a44;
    --ok: #5fd39a; --ok-bg: #173327; --warn: #ff8a80; --warn-bg: #3a1d1b; --amber: #f3c766; --amber-bg: #3a2f14; --shadow: none; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: var(--fg); background: var(--bg); padding-bottom: 46px; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
code, pre, .iid { font-family: ui-monospace, SFMono-Regular, Consolas, "D2Coding", monospace; }
code { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
pre { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow: auto; }
h1 { font-size: 24px; line-height: 1.3; margin: 6px 0; } h2 { font-size: 17px; margin: 0 0 10px; } h3, h4, h5, h6 { font-size: 15px; margin: 16px 0 6px; }
.muted { color: var(--muted); } .sm { font-size: 13px; } .nowrap { white-space: nowrap; } .grow { flex: 1; } .mt { margin-top: 18px; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 20px; max-width: 1280px; margin: 0 auto; }
.brand { font-weight: 800; color: var(--fg); white-space: nowrap; } .brand span { font-weight: 500; color: var(--muted); }
.src { font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 46vw; font-family: ui-monospace, Consolas, monospace; }
.src b { color: var(--muted); font-weight: 400; }
.tabs { display: flex; gap: 4px; padding: 0 16px; max-width: 1280px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 9px 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs a:hover { text-decoration: none; color: var(--fg); } .tabs a.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.loadbar { height: 3px; overflow: hidden; background: var(--accent-bg); } .loadbar i { display: block; height: 100%; width: 35%; background: var(--accent); animation: load 1s infinite ease-in-out; }
@keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

.btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { text-decoration: none; filter: brightness(1.05); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); font-weight: 500; } .btn.ghost:hover { background: var(--bg); }
.btn.small { padding: 2px 8px; font-size: 12px; }

/* layout */
.page { max-width: 1280px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.page.narrow { max-width: 720px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card.empty { text-align: center; padding: 40px 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 > div { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.detailgrid { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.alert { border-left: 4px solid var(--warn); background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: 6px; }
.pre { white-space: pre-wrap; font-size: 14px; }
.pill { display: inline-block; font-size: 12px; border-radius: 999px; padding: 1px 9px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.pill.state-running, .pill.state-started { background: var(--amber-bg); color: var(--amber); border-color: transparent; font-weight: 600; }
.pill.state-done { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.pill.user { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
.tag { display: inline-block; font-size: 12px; background: var(--accent-bg); color: var(--accent); border-radius: 4px; padding: 0 6px; margin: 1px 0; white-space: nowrap; }
.warn { color: var(--warn); font-weight: 600; }
.count-badge { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; vertical-align: middle; }
.iid { font-size: 13px; font-weight: 600; white-space: nowrap; } .iid.big { font-size: 14px; color: var(--accent); background: var(--accent-bg); padding: 2px 8px; border-radius: 6px; }
.ititle { color: var(--fg); }

/* tables (responsive: rows become cards on narrow screens) */
.scroll { overflow-x: auto; }
table.rt, table.md { width: 100%; border-collapse: collapse; font-size: 14px; }
table.rt th, table.md th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--bg); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.rt td, table.md td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.md { width: auto; } table.md td, table.md th { border: 1px solid var(--line); }
tr.row { cursor: pointer; } tr.row:hover td { background: var(--bg); } tr.row.open td { background: var(--accent-bg); }
.ttl { font-weight: 500; }
.caret { color: var(--muted); display: inline-block; width: 10px; }
tr.bodyrow td { background: var(--card); padding: 4px 18px 14px 34px; border-bottom: 2px solid var(--accent-bg); }
.more { display: inline-block; margin-top: 6px; font-weight: 600; }

/* overview */
.hero h1 { font-size: 28px; }
.counts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.count { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--fg); }
.count:hover { border-color: var(--accent); text-decoration: none; } .count b { font-size: 20px; } .count span { font-size: 13px; } .count small { color: var(--muted); font-size: 11px; }
.count.zero { opacity: .55; }

/* progress */
.cprow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .cprow h2 { margin: 0; }
.current p { margin: 8px 0 12px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.steps li { font-size: 12px; text-align: center; padding: 6px 2px; border-radius: 6px; background: var(--bg); color: var(--muted); line-height: 1.25; }
.steps li span { display: block; font-weight: 700; font-size: 13px; }
.steps li.past { background: var(--ok-bg); color: var(--ok); }
.steps li.on { background: var(--accent); color: #fff; font-weight: 700; box-shadow: 0 0 0 3px var(--accent-bg); }
.actions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.actions li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.cmd { display: flex; align-items: center; gap: 8px; margin-top: 6px; } .cmd code { overflow-x: auto; white-space: nowrap; flex: 1; padding: 4px 8px; }
select, input[type=search], .form input { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }

/* items */
.items { flex-direction: row; align-items: flex-start; }
.kinds { width: 220px; flex: none; position: sticky; top: 100px; }
.kinds select { display: none; width: 100%; }
.kinds ul { list-style: none; margin: 0; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.kinds a { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 6px; color: var(--fg); font-size: 14px; }
.kinds a:hover { background: var(--bg); text-decoration: none; } .kinds a.on { background: var(--accent-bg); color: var(--accent); font-weight: 700; }
.kinds a.zero { color: var(--muted); } .kinds small { color: var(--muted); }
.itembox { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.ihead { display: flex; align-items: baseline; gap: 10px; } .ihead h2 { margin: 0 0 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; }
.filter { position: relative; } .filter summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 14px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.filter summary::-webkit-details-marker { display: none; } .filter summary::after { content: " ▾"; color: var(--muted); }
.filter.set summary { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.filter .menu { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 6px; min-width: 180px; }
.filter .menu label { display: flex; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; } .filter .menu label:hover { background: var(--bg); }
.clear { font-size: 14px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.md > :first-child { margin-top: 0; }

/* detail */
.crumb { font-size: 14px; color: var(--muted); }
.summary { color: var(--muted); margin: 4px 0 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 14px; }
.relgroup { margin-bottom: 10px; } .relname { font-size: 13px; font-weight: 700; color: var(--muted); } .relname small { font-weight: 400; }
.relgroup ul, .plain, .impact { list-style: none; margin: 4px 0 0; padding: 0; } .relgroup li, .plain li, .impact li { padding: 3px 0; font-size: 14px; }
.depth { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; background: var(--bg); font-size: 11px; color: var(--muted); margin-right: 6px; }

/* change requests */
details.group > summary { list-style: none; cursor: pointer; } details.group > summary::-webkit-details-marker { display: none; }
details.group > summary h2 { display: inline; } details.group > summary::before { content: "▸ "; color: var(--muted); } details.group[open] > summary::before { content: "▾ "; }
details.group[open] > summary { margin-bottom: 10px; }

/* open */
.form { display: flex; flex-direction: column; gap: 10px; } .form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.form input { font-size: 15px; } .form details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.formerr { color: var(--warn); font-size: 13px; min-height: 1em; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 10px; border: 2px dashed var(--line); border-radius: var(--radius); padding: 34px 16px; cursor: pointer; color: var(--muted); }
.drop:hover, body.dragging .drop { border-color: var(--accent); background: var(--accent-bg); }
body.dragging::after { content: "놓으면 이 파일을 엽니다"; position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: var(--accent); background: rgba(47, 111, 222, .12); border: 4px dashed var(--accent); pointer-events: none; }

/* spec panel */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 30; }
.spec { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--card); z-index: 31; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.15); }
.spechead { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.spectabs { display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.spectabs button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
.spectabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.specbody { padding: 12px 18px 40px; overflow: auto; font-size: 14px; }

/* demo bar & toast */
.demo { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; align-items: center; gap: 12px; padding: 6px 16px; font-size: 13px; background: #1c2330; color: #cfd6e0; }
.demo select { padding: 2px 6px; font-size: 13px; }
.demo a { color: #9cc0ff; margin-left: auto; }
.toast { position: fixed; left: 50%; bottom: 60px; transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: #1c2330; color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 14px; transition: .2s; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; transform: translate(-50%, 0); } .toast.bad { background: var(--warn); }

/* ---------- tablet ---------- */
@media (max-width: 960px) {
  .items { flex-direction: column; align-items: stretch; }
  .kinds { width: auto; position: static; }
  .kinds ul { display: flex; overflow-x: auto; gap: 4px; scrollbar-width: thin; }
  .kinds a { white-space: nowrap; gap: 6px; }
  .grid2, .detailgrid { grid-template-columns: 1fr; }
  .steps { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
/* ---------- phone ---------- */
@media (max-width: 640px) {
  body { font-size: 15px; }
  .topbar { padding: 8px 12px; gap: 6px; flex-wrap: wrap; }
  .topbar .grow { display: none; }
  .src { order: 5; flex-basis: 100%; max-width: 100%; }
  .topbar .btn { padding: 4px 9px; font-size: 13px; }
  .topbar .brand { margin-right: auto; }
  .tabs { padding: 0 6px; } .tabs a { padding: 8px 10px; flex: 1; text-align: center; }
  .page { padding: 12px; gap: 12px; }
  .card, .itembox { padding: 12px; }
  .kinds ul { display: none; } .kinds select { display: block; }
  .steps { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; } .steps li { flex: 0 0 74px; scroll-snap-align: center; }
  h1 { font-size: 21px; } .hero h1 { font-size: 24px; }
  /* tables → cards */
  table.rt thead { display: none; }
  table.rt, table.rt tbody, table.rt tr, table.rt td { display: block; width: 100%; }
  table.rt tr { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; padding: 6px 10px; }
  table.rt td { border: none; padding: 2px 0 !important; display: flex; gap: 10px; }
  table.rt td::before { content: attr(data-l); flex: 0 0 76px; font-size: 12px; color: var(--muted); padding-top: 2px; }
  table.rt td:empty { display: none; }
  table.rt tr.bodyrow { margin-top: -8px; border-top: none; border-radius: 0 0 8px 8px; }
  table.rt tr.bodyrow td { display: block; } table.rt tr.bodyrow td::before { content: none; }
  table.rt tr.row.open { border-radius: 8px 8px 0 0; }
  .demo { font-size: 12px; gap: 8px; } .demo > span { display: none; }
  .spec { width: 100vw; }
}

</style>
</head>

<script type="application/json" id="spec">{"title":"ks — 로컬 소프트웨어 라이프사이클 관리 (kiotty-spec)","purpose":"1. 라이프사이클을 로컬 git 저장소 안에서 관리한다.\n   사양은 \u003c루트>/.kiotty/spec.kisp 파일 하나 (줄 단위 텍스트, diff · merge 가 쉬움).\n   코드와 함께 커밋한다.\n2. AI 가 추적성을 관리하고 필요한 것만 쿼리로 가져온다.\n   요구사항 → 설계 → 테스트 → 검사 결과가 관계로 이어져 있어,\n   ks item list · ks impact · ks diff 로 지금 일에 필요한 항목만 읽는다.\n3. 체크포인트 단위로 관리한다.\n   모든 쓰기는 한 단계의 체크포인트 안에서 하고, 사용자가 확정하면 그 시점이 고정된다.\n   - 단계마다 사람이 검토하고 승인한 뒤 다음으로 간다 (AI 가 혼자 앞서가지 않는다).\n   - 확정 조건이 빠진 연결(인수 조건 · 테스트 짝 · 검사 결과)을 막는다.\n   - 무엇이 언제 왜 바뀌었는지 체크포인트 사이 diff 로 본다.\n   - 변경 요청은 필요한 단계부터만 다시 밟는다.","roles":"- AI: 체크포인트 시작, 항목 작성, 구현, 테스트 · 검사 실행과 결과 기록.\n- 사용자만 (--actor user): checkpoint complete · prune, remote push · accept · discard.\n  AI 는 [user] 가 붙은 명령을 실행하지 않고 사용자에게 요청한다.","steps":[{"step":1,"name":"변경 요청 접수","does":"무엇을 왜 바꿀지 받는다","kinds":"CR"},{"step":2,"name":"요구사항","does":"해야 할 일과 지킬 개발 수칙을 정한다","kinds":"REQ, RULE, PRULE"},{"step":3,"name":"외부 인터페이스","does":"밖에서 보이는 약속을 정한다","kinds":"UI"},{"step":4,"name":"설계","does":"어떻게 만들지 정한다","kinds":"DSN"},{"step":5,"name":"유닛 테스트 계획","does":"설계 단위 검증 방법을 정한다","kinds":"UT"},{"step":6,"name":"개발 계획","does":"구현 순서를 마일스톤으로 묶는다","kinds":"MS"},{"step":7,"name":"구현","does":"코드와 유닛 테스트를 쓰고 돌린다","kinds":"UTR"},{"step":10,"name":"코드 검사","does":"코드가 수칙을 지키는지 수칙마다 판정","kinds":"CIR"},{"step":11,"name":"E2E 테스트 계획","does":"외부 인터페이스를 끝까지 쓰는 시나리오","kinds":"E2E"},{"step":12,"name":"E2E 테스트 실행","does":"E2E 를 돌리고 변경 요청을 닫는다","kinds":"E2ER"}],"shortSteps":["변경 요청","요구사항","외부 인터페이스","설계","유닛 테스트","개발 계획","구현","시스템 테스트 계획","시스템 테스트","코드 검사","E2E 계획","E2E 실행"],"kinds":[{"kind":"change_request","name":"변경 요청","prefix":"CR","step":"1 변경 요청 접수","tags":[{"name":"출처","values":["사용자 피드백","이슈","초기 요구","공통 수칙"],"many":true},{"name":"상태","values":["열림","반영 중","완료","거부","백로그"],"many":false},{"name":"진입 단계","values":["Step 1","Step 2","Step 3","Step 4","Step 5","Step 6","Step 7","Step 8","Step 9","Step 10","Step 11","Step 12"],"many":false}],"relations":[{"name":"영향 요구사항","to":"requirement","many":true},{"name":"영향 개발 수칙","to":"rule","many":true},{"name":"영향 외부 인터페이스","to":"external_interface","many":true},{"name":"영향 설계 사항","to":"design","many":true},{"name":"관련 마일스톤","to":"milestone","many":true},{"name":"영향 전용 개발 수칙","to":"private_rule","many":true}]},{"kind":"requirement","name":"요구사항","prefix":"REQ","step":"2 요구사항","tags":[{"name":"요구사항 종류","values":["기능 요구사항","품질 요구사항","환경 요구사항"],"many":true}],"relations":[{"name":"관련 요구사항","to":"requirement","many":true}]},{"kind":"rule","name":"개발 수칙","prefix":"RULE","step":"2 요구사항","tags":[{"name":"수칙 종류","values":["아키텍처","컨벤션","코딩 제약","의존성","테스트"],"many":true}],"relations":[]},{"kind":"external_interface","name":"외부 인터페이스","prefix":"UI","step":"3 외부 인터페이스","tags":[{"name":"인터페이스 종류","values":["GUI 뷰","C 함수","C 타입"],"many":true}],"relations":[{"name":"관련 요구사항","to":"requirement","many":true}]},{"kind":"design","name":"설계 사항","prefix":"DSN","step":"4 설계","tags":[{"name":"설계 종류","values":["모듈","동작 흐름","디렉토리","메모리 정책"],"many":true},{"name":"구현 상태","values":["미구현","변경 필요","구현 완료"],"many":false}],"relations":[{"name":"관련 요구사항","to":"requirement","many":true},{"name":"관련 외부 인터페이스","to":"external_interface","many":true},{"name":"의존 설계 사항","to":"design","many":true}]},{"kind":"unit_test_plan","name":"유닛 테스트","prefix":"UT","step":"5 유닛 테스트 계획","tags":[{"name":"구현 상태","values":["미구현","변경 필요","구현 완료"],"many":false}],"relations":[{"name":"검증 설계 사항","to":"design","many":true}]},{"kind":"milestone","name":"마일스톤","prefix":"MS","step":"6 개발 계획","tags":[],"relations":[{"name":"포함 설계 사항","to":"design","many":true},{"name":"포함 유닛 테스트","to":"unit_test_plan","many":true}]},{"kind":"unit_test_result","name":"유닛 테스트 결과","prefix":"UTR","step":"7 구현","tags":[{"name":"결과","values":["PASS","FAIL"],"many":false}],"relations":[{"name":"대상 유닛 테스트","to":"unit_test_plan","many":true}]},{"kind":"system_test_plan","name":"시스템 테스트","prefix":"ST","step":"8 시스템 테스트 계획","tags":[],"relations":[{"name":"검증 요구사항","to":"requirement","many":false}]},{"kind":"system_test_result","name":"시스템 테스트 결과","prefix":"STR","step":"9 시스템 테스트 실행","tags":[{"name":"결과","values":["PASS","FAIL"],"many":false}],"relations":[{"name":"대상 시스템 테스트","to":"system_test_plan","many":true}]},{"kind":"code_inspection_result","name":"코드 검사 결과","prefix":"CIR","step":"10 코드 검사","tags":[{"name":"결과","values":["PASS","FAIL"],"many":false}],"relations":[{"name":"검사 개발 수칙","to":"rule","many":false},{"name":"검사 전용 개발 수칙","to":"private_rule","many":false}]},{"kind":"e2e_test_plan","name":"E2E 테스트","prefix":"E2E","step":"11 E2E 테스트 계획","tags":[],"relations":[{"name":"검증 외부 인터페이스","to":"external_interface","many":false}]},{"kind":"e2e_test_result","name":"E2E 테스트 결과","prefix":"E2ER","step":"12 E2E 테스트 실행","tags":[{"name":"결과","values":["PASS","FAIL"],"many":false}],"relations":[{"name":"대상 E2E 테스트","to":"e2e_test_plan","many":true}]},{"kind":"private_rule","name":"전용 개발 수칙","prefix":"PRULE","step":"2 요구사항","tags":[{"name":"수칙 종류","values":["아키텍처","컨벤션","코딩 제약","의존성","테스트"],"many":true}],"relations":[{"name":"대체 개발 수칙","to":"rule","many":true}]}],"gui":[{"id":"UI-168","title":"브라우저 뷰어","summary":"GitHub Pages 정적 뷰어. 링크나 로컬 파일로 .kisp 를 열어 개요 · 진행 · 항목 · 변경 요청을 보인다. 보기 전용","parent":"-","body":"## 목적\n설치 없이 브라우저에서 사양 파일(.kisp)을 보는 정적 웹 뷰어. 보기 전용이며 사양 파일 해석은 wasm32 로 빌드한 라이브러리가 한다.\n\n## 포함\n- UI-169 뷰어 링크\n- UI-170 열기 화면\n- UI-171 개요 화면\n- UI-172 진행 화면\n- UI-173 항목 표 화면\n- UI-174 항목 상세 화면\n- UI-175 변경 요청 화면\n\n## 화면\n```wireframe\n화면 https://OWNER.github.io/kiotty-spec/?repo=bn3monkey/kiotty-spec&ref=v1.4#/progress\n  가로\n    머리 kiotty-spec 뷰어\n    배지 bn3monkey/kiotty-spec @ v1.4\n    링크 다른 파일 열기\n  탭 개요 | *진행 | 항목 | 변경 요청\n  세로 선택한 화면\n    글 UI-171 ~ UI-175 중 하나\n```\n\n## 공통 구성\n- 머리 줄: 뷰어 이름, 연 원천(저장소 @ 버전 또는 로컬 파일 이름), \"다른 파일 열기\" (UI-170 으로)\n- 탭: 개요 · 진행 · 항목 · 변경 요청. 항목 상세(UI-174) 는 탭이 아니라 링크로 연다\n- 화면 상태는 주소의 # 뒤에 둔다 (UI-169). 브라우저 뒤로 가기 · 앞으로 가기 · 새로 고침이 그대로 동작한다\n- 쓰기 단추 · 입력이 없다. 사양 파일을 바꾸는 방법은 화면에 없다\n\n## 사전조건\n- 지원 브라우저: Windows · macOS 의 크롬 · 엣지 · 사파리 최신 두 주 버전 (REQ-059)\n- JavaScript 와 WebAssembly 가 켜져 있다\n\n## 사후조건\n- 뷰어는 저장소 · 로컬 파일에 아무것도 쓰지 않는다\n- 사양 파일은 브라우저 메모리에서만 연다. 탭을 닫으면 사라진다\n\n## 오류 표시\n- 불러오는 중: 머리 줄 아래 진행 표시\n- 브라우저가 WebAssembly 를 지원하지 않음: \"이 브라우저에서는 열 수 없습니다\" 와 지원 브라우저 목록\n- 열기 실패: UI-170 열기 화면에 이유를 보인다\n"},{"id":"UI-169","title":"뷰어 링크","summary":"?repo=OWNER/NAME&ref=REF&path=PATH 로 원천을, # 뒤로 화면을 정한다","parent":"UI-168","body":"## 시그니처\n```text\nhttps://\u003c뷰어 주소>/?repo=OWNER/NAME[&ref=REF][&path=PATH][#/\u003c화면>]\n\n#/overview                          개요 (UI-171)\n#/progress                          진행 (UI-172, 기본)\n#/items/\u003cKIND>[?tag=이름:값&q=글자]  항목 표 (UI-173)\n#/item/\u003cID>                         항목 상세 (UI-174)\n#/changes                           변경 요청 (UI-175)\n```\n\n## 매개변수\n| 이름 | 필수 | 기본값 | 뜻 |\n| --- | --- | --- | --- |\n| repo | 예 (없으면 UI-170) | — | 공개 GitHub 저장소 OWNER/NAME |\n| ref | 아니오 | 저장소 기본 브랜치 | 태그 · 브랜치 · commit |\n| path | 아니오 | .kiotty/spec.kisp | 저장소 안 사양 파일 위치 |\n| KIND | — | — | ks 의 Kind 이름 (requirement, design 등) |\n| tag | 아니오 | — | 태그 거르기. 여러 번 쓸 수 있다 |\n| q | 아니오 | — | 제목 · 요약 글자 찾기 |\n\n모든 값은 URL 인코딩한다 (한글 태그 이름 포함).\n\n## 사전조건\n- 저장소가 공개이고, 그 ref 에 path 파일이 있다\n\n## 사후조건\n- `https://raw.githubusercontent.com/OWNER/NAME/REF/PATH` 를 받아 연다\n- 같은 링크는 누가 열어도 같은 내용을 보인다 (ref 가 태그 · commit 일 때)\n- # 뒤만 바뀌면 파일을 다시 받지 않는다\n\n## 오류 표시\n열 수 없으면 UI-170 열기 화면에 아래 문구와 입력한 값을 채워 보인다.\n- 저장소를 찾지 못함: \"저장소 OWNER/NAME 을 찾지 못했습니다 (없거나 비공개)\"\n- 버전을 찾지 못함: \"버전 REF 를 찾지 못했습니다\"\n- 파일을 찾지 못함: \"REF 에 PATH 가 없습니다\"\n- 형식이 다름: \"사양 파일 형식이 아닙니다 (N 번째 줄)\" 또는 \"이 뷰어가 모르는 모델 버전입니다\"\n- 너무 큼: \"기록이 뷰어 용량보다 큽니다\"\n- 네트워크 실패: \"파일을 받지 못했습니다\" 와 다시 시도\n- 없는 KIND: 항목 화면에 \"없는 종류: KIND\". 없는 ID: UI-174 의 없는 항목 표시\n- 비공개 저장소 · 찾지 못함 문구에는 로컬 파일 열기 안내를 붙인다 (REQ-054)\n"},{"id":"UI-170","title":"열기 화면","summary":"공개 저장소 입력과 로컬 파일 끌어 놓기 · 고르기, 열기 실패 이유","parent":"UI-168","body":"## 목적\n링크에 저장소가 없거나 열기에 실패했을 때, 또는 \"다른 파일 열기\" 를 눌렀을 때 원천을 고른다.\n\n## 화면\n```wireframe\n화면 https://OWNER.github.io/kiotty-spec/\n  가로\n    머리 kiotty-spec 뷰어\n  알림 버전 v9.9 를 찾지 못했습니다. 비공개 저장소라면 아래에서 로컬 파일로 여세요\n  세로 공개 저장소에서 열기\n    가로\n      입력 OWNER/NAME\n      입력 버전 (태그 · 브랜치 · commit, 비우면 기본 브랜치)\n    입력 파일 위치 (.kiotty/spec.kisp)\n    버튼 열기\n  세로 내 PC 의 파일 열기\n    상자 .kisp 파일을 여기에 끌어 놓으세요\n    버튼 파일 고르기\n```\n\n## 구성\n- 공개 저장소 입력: 저장소(OWNER/NAME), 버전, 파일 위치. 앞서 실패한 링크의 값을 채워 둔다\n- 열기: 입력값으로 UI-169 링크를 만들어 그 주소로 간다 (링크를 복사해 보낼 수 있다)\n- 끌어 놓기 상자 · 파일 고르기: 로컬 .kisp 를 연다\n- 오류 알림: UI-169 의 문구\n\n## 사전조건\n- 없음\n\n## 사후조건\n- 로컬 파일은 브라우저 안에서만 읽고 어디에도 보내지 않는다. 주소에 repo 를 넣지 않는다 (새로 고침하면 열기 화면으로 돌아온다)\n- 로컬 파일을 열면 머리 줄에 파일 이름을 보이고 진행 화면(UI-172) 으로 간다\n- 파일이 열린 뒤에도 뷰어 어디에든 끌어 놓으면 새 파일을 연다\n\n## 오류 표시\n- 저장소 입력이 OWNER/NAME 꼴이 아님: 열기 단추 아래 \"OWNER/NAME 꼴로 입력하세요\", 이동하지 않는다\n- 로컬 파일 형식이 다름: \"사양 파일 형식이 아닙니다 (N 번째 줄)\". 앞서 연 파일이 있으면 그대로 둔다\n- 여러 파일을 끌어 놓음: 첫 파일만 열고 \"파일 하나만 엽니다\" 를 알린다\n"},{"id":"UI-171","title":"개요 화면","summary":"#/overview. ks guide 의 목적 · 역할 · 12 단계와 프로젝트 이름 · 종류별 항목 수","parent":"UI-168","body":"## 목적\n이 기록이 무엇인지 처음 보는 사람에게 알린다. 내용은 ks guide 와 같다.\n\n## 화면\n```wireframe\n화면 ...#/overview\n  탭 *개요 | 진행 | 항목 | 변경 요청\n  세로 kiotty-spec\n    글 만든 시각 2026-11-10 · 항목 812 개\n  세로 목적\n    글 라이프사이클을 로컬 git 저장소 안에서 관리한다 ...\n  세로 역할\n    글 AI: 체크포인트 시작, 항목 작성, 구현, 테스트 · 검사\n    글 사용자: 체크포인트 확정\n  세로 12 단계\n    표 단계 | 이름 | 하는 일 | 항목\n      행 1 | 변경 요청 접수 | 무엇을 왜 바꿀지 받는다 | CR\n      행 2 | 요구사항 | 해야 할 일과 지킬 개발 수칙을 정한다 | REQ, RULE, PRULE\n      행 ... | ... | ... | ...\n  세로 항목 수\n    표 종류 | 개수\n      행 requirement | 59\n```\n\n## 구성\n- 프로젝트 이름 · 만든 시각\n- 목적 · 역할 · 12 단계: ks guide 의 [목적] · [역할] · [12 단계] 와 같은 글\n- 종류별 항목 수. 누르면 그 종류의 항목 표(UI-173)\n\n## 사전조건\n- 사양 파일이 열려 있다\n\n## 사후조건\n- 사양 파일이 바뀌어도 목적 · 역할 · 12 단계 글은 뷰어 버전을 따른다\n\n## 오류 표시\n- 프로젝트 이름이 없음: 이름 대신 원천(저장소 또는 파일 이름)\n"},{"id":"UI-172","title":"진행 화면","summary":"#/progress (기본). ks next 의 현재 체크포인트 · 진행 줄 · 작업할 항목 · 할 행동과 체크포인트 목록","parent":"UI-168","body":"## 목적\n지금 어디까지 왔는지 보인다. 파일을 열면 처음 보이는 화면이다. 내용은 ks next 와 ks checkpoint list 와 같다.\n\n## 화면\n```wireframe\n화면 ...#/progress\n  탭 개요 | *진행 | 항목 | 변경 요청\n  글 처음이면 개요 탭에서 이 기록이 무엇인지 보세요\n  세로 현재 체크포인트\n    가로\n      제목 CP-0088\n      배지 3 외부 인터페이스\n      배지 진행 중\n    글 CR-019 브라우저 뷰어 화면과 링크\n    진행 변경 요청 | 요구사항 | *외부 인터페이스 | 설계 | 유닛 테스트 | 개발 계획 | 구현 | 시스템 테스트 계획 | 시스템 테스트 | 코드 검사 | E2E 계획 | E2E 실행\n  세로 작업할 항목\n    표 ID | 종류 | 이유\n      행 REQ-060 | requirement | 인수 조건이 없음\n  세로 할 행동\n    글 사용자에게 확정을 요청한다 — ks checkpoint complete --actor user (사용자)\n  세로 체크포인트\n    표 CP | 단계 | 상태 | 설명 | 시각\n      행 CP-0088 | 3 외부 인터페이스 | 진행 중 | CR-019 브라우저 뷰어 화면과 링크 | 2026-11-17 18:10\n      행 CP-0087 | 2 요구사항 | 확정 | CR-019 브라우저 뷰어 요구사항 | 2026-11-17 17:40\n```\n\n## 구성\n- 현재 체크포인트: CP, 단계, 상태, 설명과 12 단계 진행 줄 (지금 단계 강조)\n- 작업할 항목: ID(UI-174 링크), 종류, 이유. 없으면 이 부분을 숨긴다\n- 할 행동: ks next 의 행동 글과 명령. 명령은 복사만 할 수 있다\n- 체크포인트 목록: 최근 것부터, 단계 필터\n\n## 사전조건\n- 사양 파일이 열려 있다\n\n## 사후조건\n- 체크포인트 · 단계 · 상태 · 작업할 항목은 같은 파일에서 ks next 가 찍는 것과 같다\n\n## 오류 표시\n- 체크포인트가 없음: \"진행 기록이 없습니다\" 만 보이고 다른 탭은 열린다\n"},{"id":"UI-173","title":"항목 표 화면","summary":"#/items/KIND. 종류 목록, 찾기 · 태그 거르기, ID 순 표와 펼친 본문","parent":"UI-168","body":"## 목적\n항목을 종류별 표로 보고 태그 · 글자로 걸러 찾는다.\n\n## 화면\n```wireframe\n화면 ...#/items/requirement?tag=요구사항 종류:환경 요구사항\n  탭 개요 | 진행 | *항목 | 변경 요청\n  가로\n    세로 종류\n      링크 change_request (19)\n      링크 *requirement (59)\n      링크 rule (75)\n      링크 design (110)\n      링크 ...\n    세로 requirement\n      가로\n        입력 제목 · 요약에서 찾기\n        고르기 요구사항 종류: 환경 요구사항\n        배지 3 / 59\n      표 ID | 제목 | 요약 | 요구사항 종류 | 체크포인트\n        행 ▸ REQ-037 | 빌드 환경 | - | 환경 요구사항 | CP-0087\n        행 ▾ REQ-059 | 뷰어 실행 환경 | - | 환경 요구사항 | CP-0087\n      본문 ## 진술 / 뷰어는 Windows 와 macOS 의 ... (펼친 본문)  [상세 보기 →]\n```\n\n## 구성\n- 종류 목록: ks 의 Kind 순서, 이름과 항목 수. 항목이 없는 종류도 보인다\n- 찾기 입력: 제목 · 요약에 그 글자가 있는 항목만 (대소문자 무시)\n- 태그 고르기: 그 종류 모델의 태그마다 하나 (ks model KIND). 값 여럿을 고르면 그중 하나라도 맞는 항목\n- 표 열: ID, 제목, 요약, 모델의 태그들, 체크포인트. ID 순서. 하위 항목은 상위 바로 아래에 들여 쓴다 (거르기로 상위가 빠지면 하위는 그대로 보인다)\n- 줄을 누르면 본문을 펼친다. \"상세 보기\" 는 UI-174\n- 결과 수: 거른 수 / 전체 수\n- 찾기 · 거르기 값은 주소에 남는다 (UI-169 의 tag · q)\n\n## 사전조건\n- 사양 파일이 열려 있다\n\n## 사후조건\n- 거르지 않은 표의 항목은 같은 파일에서 ks item list --kind KIND 와 같다\n- 본문은 Markdown 으로 보이고 HTML 태그 · 스크립트는 글자 그대로 보인다 (실행하지 않는다)\n\n## 오류 표시\n- 항목이 없는 종류: \"이 종류의 항목이 없습니다\"\n- 거른 결과가 없음: \"맞는 항목이 없습니다\" 와 거르기 지우기\n- 본문이 없음: \"본문 없음\"\n"},{"id":"UI-174","title":"항목 상세 화면","summary":"#/item/ID. 머리 · 태그 · 본문, 관계 이름별 나가는 · 들어오는 관계, 영향 항목, 하위 항목","parent":"UI-168","body":"## 목적\n항목 하나의 내용과 추적 관계를 보고 따라간다.\n\n## 화면\n```wireframe\n화면 ...#/item/REQ-053\n  탭 개요 | 진행 | 항목 | 변경 요청\n  가로\n    제목 REQ-053 공개 저장소의 사양 파일을 링크로 연다\n    배지 requirement\n    배지 CP-0087\n  글 상위: REQ-052 설치 없이 브라우저에서 사양 기록을 본다\n  표 태그 | 값\n    행 요구사항 종류 | 기능 요구사항\n  본문 ## 진술 / 협업자는 공개 git 저장소와 그 버전을 담은 링크 하나로 ...\n  가로\n    세로 이 항목이 가리키는 것\n      글 (없음)\n    세로 이 항목을 가리키는 것\n      글 영향 요구사항\n      링크 CR-019 GitHub Pages 정적 뷰어로 .kisp 열람\n      글 관련 요구사항\n      링크 UI-169 뷰어 링크\n  세로 영향 항목 (ks impact)\n    링크 CR-019 · UI-169 · UI-170\n  세로 하위 항목\n    글 (없음)\n```\n\n## 구성\n- 머리: ID, 제목, 종류, 체크포인트, 요약, 상위 항목 링크\n- 태그 표: 그 종류 모델의 태그와 값 (ks item show --tags)\n- 본문: Markdown (UI-173 과 같은 규칙)\n- 관계: 나가는 관계 · 들어오는 관계를 관계 이름별로. 상대는 ID 와 제목 링크 (ks relation list)\n- 영향 항목: 이 항목을 가리키는 하류 항목 (ks impact, 깊이 기본값). ID 링크\n- 하위 항목: ID 와 제목 링크 (ks item children)\n- 변경 요청이면 나가는 관계(영향 요구사항 · 영향 개발 수칙 · 영향 외부 인터페이스 · 영향 설계 사항 · 관련 마일스톤 · 영향 전용 개발 수칙) 가 영향 항목 묶음이 된다 (REQ-058)\n\n## 사전조건\n- 사양 파일이 열려 있다\n\n## 사후조건\n- 링크를 누르면 #/item/\u003cID> 로 가고 뒤로 가기로 돌아온다\n- 관계 · 영향 항목은 같은 파일에서 ks relation list · ks impact 와 같다\n\n## 오류 표시\n- 없는 ID: \"없는 항목: ID\" 와 항목 표로 가는 링크\n"},{"id":"UI-175","title":"변경 요청 화면","summary":"#/changes. 상태별 묶음(열림 · 반영 중 먼저), 줄을 누르면 항목 상세","parent":"UI-168","body":"## 목적\n변경 요청을 상태별로 보고 각 변경이 건드리는 항목으로 간다.\n\n## 화면\n```wireframe\n화면 ...#/changes\n  탭 개요 | 진행 | 항목 | *변경 요청\n  세로 열림 · 반영 중 (1)\n    표 ID | 제목 | 출처 | 진입 단계 | 영향 항목\n      행 CR-019 | GitHub Pages 정적 뷰어로 .kisp 열람 | 사용자 피드백 | Step 2 | 20\n  세로 백로그 (0)\n    글 (없음)\n  세로 완료 (17)\n    표 ID | 제목 | 출처 | 진입 단계 | 영향 항목\n      행 CR-018 | context/ 를 C 인터페이스의 Context 정의만으로 | 사용자 피드백 | Step 2 | 46\n      행 ... | ... | ... | ... | ...\n  세로 거부 (1)\n    글 ▸ 펼치기\n```\n\n## 구성\n- 상태 묶음 순서: 열림 · 반영 중, 백로그, 완료, 거부. 묶음마다 개수. 완료 · 거부는 접혀서 시작한다\n- 줄: ID, 제목, 요약(마우스를 올리면), 출처, 진입 단계, 영향 항목 수 (변경 요청에서 나가는 관계 수)\n- 줄을 누르면 UI-174 항목 상세로 간다. 거기서 본문과 영향 항목을 관계 이름별로 본다\n- 묶음 안은 ID 내림차순 (새 변경 요청이 위)\n\n## 사전조건\n- 사양 파일이 열려 있다\n\n## 사후조건\n- 묶음의 변경 요청은 같은 파일에서 ks item list --kind change_request --tag 상태=값 과 같다\n\n## 오류 표시\n- 변경 요청이 없음: \"변경 요청이 없습니다\"\n- 상태 태그가 없는 변경 요청: \"상태 없음\" 묶음을 맨 끝에 둔다\n"}]}</script>

004","kind":"requirement","title":"오프라인에서 고치고 연결되면 보낸다","summary":"-","checkpoint":"CP-0014","parent":"REQ-001","tags":{"요구사항 종류":["기능 요구사항"]},"body":"## 진술\n연결이 없어도 메모를 고칠 수 있고, 다시 연결되면 순서대로 보낸다.\n\n## 인수 조건\n- 전제 조건: 비행기 모드 / 행동: 메모 3 개를 고친다 / 기대 결과: 목록에 '보내기 대기 3' 이 보인다\n- 전제 조건: 대기 3 / 행동: 연결한다 / 기대 결과: 30 초 안에 대기 0"},{"id":"REQ-005","kind":"requirement","title":"같은 메모를 두 곳에서 고치면 두 판을 남긴다","summary":"\u003cscript>alert('본문 안의 스크립트는 실행되지 않는다')\u003c/script> 충돌 시 사용자가 고른다","checkpoint":"CP-0014","parent":"REQ-001","tags":{"요구사항 종류":["기능 요구사항"]},"body":"## 진술\n두 기기가 같은 메모를 오프라인에서 고치면 두 판을 모두 남기고 사용자가 고른다.\n\n\u003cscript>alert('실행되면 안 됨')\u003c/script>\n\n(인수 조건은 아직 쓰지 않음 — 진행 화면의 작업할 항목)"},{"id":"REQ-006","kind":"requirement","title":"동기화가 5 초 안에 끝난다","summary":"LTE 기준 메모 100 개","checkpoint":"CP-0002","tags":{"요구사항 종류":["품질 요구사항"]},"body":"## 진술\nLTE 에서 메모 100 개의 첫 동기화가 5 초 안에 끝난다."},{"id":"REQ-007","kind":"requirement","title":"지원 플랫폼","summary":"-","checkpoint":"CP-0002","tags":{"요구사항 종류":["환경 요구사항"]},"body":"## 진술\nAndroid 12 이상, Windows 10 이상."},{"id":"RULE-001","kind":"rule","title":"1.1 예외를 던지지 않는다","summary":"실패는 Result 로 돌려준다","checkpoint":"CP-0002","tags":{"수칙 종류":["코딩 제약"]},"body":"## 이유\n예외는 호출 경로에서 보이지 않는다.\n\n```cpp\nResult\u003cMemo> load(MemoId id);   // 지키는 예\nMemo load(MemoId id);           // 어기는 예 (throw)\n```"},{"id":"RULE-002","kind":"rule","title":"2.1 UI 는 domain 을 거쳐 저장소를 쓴다","summary":"-","checkpoint":"CP-0002","tags":{"수칙 종류":["아키텍처","의존성"]},"body":"UI 코드는 repository 를 직접 import 하지 않는다."},{"id":"RULE-003","kind":"rule","title":"5.1 테스트는 네트워크 없이 돈다","summary":"-","checkpoint":"CP-0002","tags":{"수칙 종류":["테스트"]},"body":"서버는 가짜 전송 계층으로 바꾼다."},{"id":"PRULE-001","kind":"private_rule","title":"1.1 예외를 던지지 않는다 (플랫폼 SDK 경계는 잡는다)","summary":"공통 수칙 1.1 의 프로젝트 판","checkpoint":"CP-0002","tags":{"수칙 종류":["코딩 제약"]},"body":"## 범위\nAndroid SDK 호출 줄은 예외를 잡아 Result 로 바꾼다."},{"id":"UI-001","kind":"external_interface","title":"메모 목록 화면","summary":"-","checkpo <script>
// kiotty-spec browser viewer prototype (CR-019). Screens follow UI-168 .. UI-175.
// Data: #spec comes from ks (GUI view items, models, guide), #dummy is dummy project data.
'use strict';
(function () {
  const SPEC = JSON.parse(document.getElementById('spec').textContent);
  const DUMMY = JSON.parse(document.getElementById('dummy').textContent);
  const KINDS = SPEC.kinds;
  const KIND = Object.fromEntries(KINDS.map((k) => [k.kind, k]));
  const STEP_NAME = Object.fromEntries(SPEC.steps.map((s) => [s.step, s.name]));
  const GUI = Object.fromEntries(SPEC.gui.map((g) => [g.id, g]));
  const SCREEN_UI = { open: 'UI-170', overview: 'UI-171', progress: 'UI-172', items: 'UI-173', item: 'UI-174', changes: 'UI-175' };
  const CP_STATE = { running: '진행 중', started: '시작', done: '확정' };
  const CR_GROUPS = [
    { title: '열림 · 반영 중', values: ['열림', '반영 중'], open: true },
    { title: '백로그', values: ['백로그'], open: true },
    { title: '완료', values: ['완료'], open: false },
    { title: '거부', values: ['거부'], open: false },
  ];

  const app = document.getElementById('app');
  const S = {
    data: null, source: null, loading: false, error: null, notice: null,
    openForm: { repo: '', ref: '', path: '' },
    expanded: new Set(), specOpen: false, specTab: null, cpStep: '', demo: 'normal',
  };
  let byId = new Map();

  // ---------- helpers ----------
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const dash = (s) => (s && s !== '-' ? s : '');
  const fmtTime = (sec) => { const d = new Date(sec * 1000); const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const idNum = (id) => { const m = id.match(/^([A-Z0-9]+?)-(\d+)$/); return m ? [m[1], Number(m[2])] : [id, 0]; };
  const byIdOrder = (a, b) => { const [pa, na] = idNum(a.id); const [pb, nb] = idNum(b.id); return pa === pb ? na - nb : pa < pb ? -1 : 1; };
  const itemLink = (id) => (byId.has(id) ? `<a href="#/item/${encodeURIComponent(id)}" class="iid">${esc(id)}</a>` : `<span class="iid">${esc(id)}</span>`);
  const itemRef = (id) => { const it = byId.get(id); return `${itemLink(id)}${it ? ` <span class="ititle">${esc(it.title)}</span>` : ''}`; };
  const tagsOf = (it, name) => (it.tags && it.tags[name]) || [];

  function inline(s, linkIds) {
    let h = esc(s);
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    if (linkIds) h = h.replace(/\b([A-Z][A-Z0-9]*-\d{3,4})\b/g, (m) => (byId.has(m) ? itemLink(m) : GUI[m] ? `<a href="#" data-spec="${m}">${m}</a>` : m));
    return h;
  }
  // Markdown subset. Everything is escaped first: HTML in a body shows as text.
  function markdown(md, opts = {}) {
    const lines = String(md || '').replace(/\r/g, '').split('\n');
    const out = [];
    let i = 0;
    const isBlock = (l) => /^(```|#{1,4}\s|\s*\||\s*([-*]|\d+\.)\s)/.test(l);
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^```\s*(\S*)/);
      if (fence) {
        const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        if (fence[1] === 'wireframe' && opts.wireframe) out.push(opts.wireframe());
        else out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
        continue;
      }
      const h = line.match(/^(#{1,4})\s+(.*)/);
      if (h) { const n = Math.min(6, h[1].length + 2); out.push(`<h${n}>${inline(h[2], opts.links)}</h${n}>`); i++; continue; }
      if (/^\s*\|/.test(line)) {
        const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
        const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const body = rows.filter((r, k) => !(k === 1 && /^[\s|:-]+$/.test(r)));
        const [head, ...rest] = body;
        out.push('<div class="scroll"><table class="md"><thead><tr>' + cells(head).map((c) => `<th>${inline(c, opts.links)}</th>`).join('') + '</tr></thead><tbody>' +
          rest.map((r) => '<tr>' + cells(r).map((c) => `<td>${inline(c, opts.links)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        const ordered = /^\s*\d+\./.test(line); const items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
        const t = ordered ? 'ol' : 'ul';
        out.push(`<${t}>` + items.map((x) => `<li>${inline(x, opts.links)}</li>`).join('') + `</${t}>`);
        continue;
      }
      if (line.trim() === '') { i++; continue; }
      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !isBlock(lines[i])) para.push(lines[i++]);
      out.push(`<p>${inline(para.join(' '), opts.links)}</p>`);
    }
    return out.join('\n');
  }

  // ---------- routing ----------
  function route() {
    const h = decodeURI(location.hash.replace(/^#\/?/, ''));
    const [p, qs] = h.split('?');
    const parts = p.split('/').filter(Boolean);
    const params = new URLSearchParams(qs || '');
    return { screen: parts[0] || 'progress', arg: parts[1] ? decodeURIComponent(parts[1]) : '', params };
  }
  const go = (hash) => { location.hash = hash; };
  function itemsHash(kind, q, tags) {
    const p = new URLSearchParams();
    for (const t of tags) p.append('tag', t);
    if (q) p.set('q', q);
    const s = p.toString();
    return `#/items/${kind}${s ? '?' + s : ''}`;
  }

  // ---------- data ----------
  function load(source, delay = 450) {
    S.loading = true; S.error = null; render();
    setTimeout(() => {
      const d = JSON.parse(JSON.stringify(DUMMY));
      if (S.demo === 'nocp') { d.checkpoints = []; d.next = { work: [], actions: [{ text: '체크포인트를 시작한다', command: 'ks checkpoint start 1 --description "..."' }] }; }
      if (S.demo === 'nocr') { d.items = d.items.filter((x) => x.kind !== 'change_request'); }
      S.data = d; S.source = source; S.loading = false;
      byId = new Map(d.items.map((x) => [x.id, x]));
      S.expanded.clear();
      const r = route();
      if (r.screen === 'open' || !location.hash) go('#/progress'); else render();
    }, delay);
  }
  function failOpen(msg) { S.loading = false; S.error = msg; if (route().screen !== 'open') go('#/open'); else render(); }

  function openRemote(repo, ref, filePath) {
    const src = DUMMY.source;
    const local = ' 비공개 저장소라면 아래에서 로컬 파일로 여세요.';
    S.openForm = { repo, ref, path: filePath };
    S.loading = true; S.error = null; render();
    setTimeout(() => {
      if (repo !== src.repo) return failOpen(`저장소 ${repo} 을 찾지 못했습니다 (없거나 비공개).${local}`);
      if (ref && ref !== src.ref && ref !== 'main') return failOpen(`버전 ${ref} 를 찾지 못했습니다.${local}`);
      if (filePath && filePath !== src.path) return failOpen(`${ref || 'main'} 에 ${filePath} 가 없습니다.`);
      load({ repo, ref: ref || 'main', path: filePath || src.path }, 0);
    }, 450);
  }
  function openFiles(files) {
    if (!files || !files.length) return;
    const f = files[0];
    if (files.length > 1) toast('파일 하나만 엽니다');
    const reader = new FileReader();
    reader.onload = () => {
      const first = String(reader.result).split('\n')[0];
      if (!/^#kisp \d+ model \d+/.test(first)) {
        const msg = '사양 파일 형식이 아닙니다 (1 번째 줄)';
        if (S.data) toast(msg, true); else failOpen(msg);
        return;
      }
      toast('프로토타입: 파일 내용 대신 더미 데이터를 보여 줍니다');
      load({ file: f.name });
    };
    reader.readAsText(f.slice(0, 256));
  }

  // ---------- shell ----------
  let toastTimer = 0;
  function toast(msg, bad) {
    let t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.className = 'toast show' + (bad ? ' bad' : '');
    t.textContent = msg;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast'; }, 2600);
  }
  function sourceBadge() {
    if (!S.source) return '';
    if (S.source.file) return `<span class="src" title="로컬 파일">📄 ${esc(S.source.file)}</span>`;
    return `<span class="src" title="${esc(S.source.path)}">${esc(S.source.repo)} <b>@</b> ${esc(S.source.ref)}</span>`;
  }
  function header(screen) {
    const tabs = [['overview', '개요'], ['progress', '진행'], ['items', '항목'], ['changes', '변경 요청']];
    const tabHref = (k) => (k === 'items' ? `#/items/${S.lastKind || 'requirement'}` : `#/${k}`);
    const active = screen === 'item' ? '' : screen;
    return `
<header class="top">
  <div class="topbar">
    <a class="brand" href="#/progress">kiotty-spec <span>뷰어</span></a>
    ${sourceBadge()}
    <span class="grow"></span>
    <a class="btn ghost" href="#/open" title="다른 파일 열기">다른 파일 열기</a>
    <button class="btn ghost" data-act="spec" title="이 화면의 ks 명세">명세</button>
  </div>
  ${S.data ? `<nav class="tabs">${tabs.map(([k, t]) => `<a href="${tabHref(k)}" class="${active === k ? 'on' : ''}">${t}</a>`).join('')}</nav>` : ''}
  ${S.loading ? '<div class="loadbar"><i></i></div>' : ''}
</header>`;
  }
  function demoBar() {
    const opts = [['normal', '정상 데이터'], ['nocp', '진행 기록 없음'], ['nocr', '변경 요청 없음'], ['nowasm', 'WebAssembly 미지원']];
    return `<div class="demo"><span>프로토타입 · 더미 데이터</span>
      <select data-act="demo" aria-label="데모 상태">${opts.map(([v, t]) => `<option value="${v}" ${S.demo === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <a href="viewer_interface.html" target="_blank">인터페이스 명세</a></div>`;
  }
  function specPanel(screen) {
    if (!S.specOpen) return '';
    const cur = SCREEN_UI[screen] || 'UI-168';
    const tab = S.specTab && GUI[S.specTab] ? S.specTab : cur;
    const ids = Array.from(new Set([cur, 'UI-168', 'UI-169', tab])).filter((x) => GUI[x]);
    const g = GUI[tab];
    const body = markdown(g.body, { links: true, wireframe: () => `<p class="muted">화면 그림: <a href="viewer_interface.html#${tab}" target="_blank">viewer_interface.html#${tab}</a></p>` });
    return `<div class="scrim" data-act="spec"></div>
<aside class="spec" aria-label="명세">
  <div class="spechead"><b>ks 명세</b><span class="grow"></span><button class="btn ghost" data-act="spec">닫기</button></div>
  <div class="spectabs">${ids.map((x) => `<button class="${x === tab ? 'on' : ''}" data-spec="${x}">${x} ${esc(GUI[x].title)}</button>`).join('')}</div>
  <div class="specbody"><h2>${tab} ${esc(g.title)}</h2><p class="muted">${esc(dash(g.summary))}</p>${body}</div>
</aside>`;
  }

  // ---------- screens ----------
  function screenOpen() {
    const f = S.openForm;
    return `<main class="page narrow">
  ${S.error ? `<div class="alert">${esc(S.error)}</div>` : ''}
  <section class="card">
    <h2>공개 저장소에서 열기</h2>
    <form data-form="open" class="form" novalidate>
      <label>저장소<input name="repo" placeholder="OWNER/NAME" value="${esc(f.repo)}" autocomplete="off"></label>
      <label>버전<input name="ref" placeholder="태그 · 브랜치 · commit (비우면 기본 브랜치)" value="${esc(f.ref)}" autocomplete="off"></label>
      <details ${f.path ? 'open' : ''}><summary>파일 위치</summary><label><input name="path" placeholder=".kiotty/spec.kisp" value="${esc(f.path)}" autocomplete="off"></label></details>
      <div class="formerr" id="formerr"></div>
      <div><button class="btn" type="submit">열기</button> <span class="muted">예: ${esc(DUMMY.source.repo)} · ${esc(DUMMY.source.ref)}</span></div>
    </form>
  </section>
  <section class="card">
    <h2>내 PC 의 파일 열기</h2>
    <label class="drop" id="drop"><input type="file" accept=".kisp" hidden data-act="file"><span>.kisp 파일을 여기에 끌어 놓으세요</span><span class="btn">파일 고르기</span></label>
    <p class="muted">파일은 브라우저 안에서만 읽고 어디에도 보내지 않습니다.</p>
  </section>
</main>`;
  }

  function screenOverview() {
    const d = S.data;
    const counts = KINDS.map((k) => ({ k, n: d.items.filter((x) => x.kind === k.kind).length }));
    return `<main class="page">
  <section class="hero">
    <h1>${esc(d.project.name || (S.source && (S.source.repo || S.source.file)))}</h1>
    <p class="muted">만든 시각 ${fmtTime(d.project.createdAt)} · 항목 ${d.items.length} 개 · 체크포인트 ${d.checkpoints.length} 개</p>
  </section>
  <div class="grid2">
    <section class="card"><h2>목적</h2><div class="pre">${esc(SPEC.purpose)}</div></section>
    <section class="card"><h2>역할</h2><div class="pre">${esc(SPEC.roles)}</div>
      <h2 class="mt">항목 수</h2>
      <div class="counts">${counts.map(({ k, n }) => `<a href="#/items/${k.kind}" class="count ${n ? '' : 'zero'}"><b>${n}</b><span>${esc(k.name)}</span><small>${k.prefix}</small></a>`).join('')}</div>
    </section>
  </div>
  <section class="card"><h2>12 단계</h2>
    <table class="rt"><thead><tr><th>단계</th><th>이름</th><th>하는 일</th><th>항목</th></tr></thead><tbody>
    ${SPEC.steps.map((s) => `<tr><td data-l="단계">${s.step}</td><td data-l="이름"><b>${esc(s.name)}</b></td><td data-l="하는 일">${esc(s.does)}</td><td data-l="항목">${esc(s.kinds)}</td></tr>`).join('')}
    </tbody></table>
  </section>
</main>`;
  }

  function stepChips(cur) {
    return `<ol class="steps">${SPEC.shortSteps.map((n, i) => `<li class="${i + 1 === cur.step ? 'on' : i + 1 < cur.step ? 'past' : ''}"><span>${i + 1}</span>${esc(n)}</li>`).join('')}</ol>`;
  }
  function screenProgress() {
    const d = S.data;
    if (!d.checkpoints.length) {
      return `<main class="page"><section class="card empty"><h2>진행 기록이 없습니다</h2><p class="muted">체크포인트가 아직 없습니다. 다른 탭은 그대로 볼 수 있습니다.</p>
      ${actions(d.next.actions)}</section></main>`;
    }
    const cur = d.checkpoints[d.checkpoints.length - 1];
    const list = d.checkpoints.slice().reverse().filter((c) => !S.cpStep || String(c.step) === S.cpStep);
    return `<main class="page">
  <p class="hint">처음이면 <a href="#/overview">개요</a> 에서 이 기록이 무엇인지 보세요.</p>
  <section class="card current">
    <div class="cprow"><h2>${esc(cur.id)}</h2><span class="pill">${cur.step} ${esc(STEP_NAME[cur.step] || '')}</span><span class="pill state-${cur.state}">${esc(CP_STATE[cur.state] || cur.state)}</span><span class="muted">${fmtTime(cur.createdAt)}</span></div>
    <p>${inline(cur.description, true)}</p>
    ${stepChips(cur)}
  </section>
  ${d.next.work.length ? `<section class="card"><h2>작업할 항목 <span class="count-badge">${d.next.work.length}</span></h2>
    <table class="rt"><thead><tr><th>ID</th><th>종류</th><th>제목</th><th>이유</th></tr></thead><tbody>
    ${d.next.work.map((w) => { const it = byId.get(w.id); return `<tr><td data-l="ID">${itemLink(w.id)}</td><td data-l="종류">${esc(it ? KIND[it.kind].name : '')}</td><td data-l="제목">${esc(it ? it.title : '')}</td><td data-l="이유"><span class="warn">${esc(w.reason)}</span></td></tr>`; }).join('')}
    </tbody></table></section>` : ''}
  <section class="card"><h2>할 행동</h2>${actions(d.next.actions)}</section>
  <section class="card"><div class="cprow"><h2>체크포인트</h2><span class="grow"></span>
    <select data-act="cpstep" aria-label="단계 거르기"><option value="">모든 단계</option>${SPEC.steps.map((s) => `<option value="${s.step}" ${S.cpStep === String(s.step) ? 'selected' : ''}>${s.step} ${esc(s.name)}</option>`).join('')}</select></div>
    <table class="rt"><thead><tr><th>CP</th><th>단계</th><th>상태</th><th>설명</th><th>시각</th></tr></thead><tbody>
    ${list.map((c) => `<tr><td data-l="CP"><b>${esc(c.id)}</b></td><td data-l="단계">${c.step} ${esc(STEP_NAME[c.step] || '')}</td><td data-l="상태"><span class="pill state-${c.state}">${esc(CP_STATE[c.state] || c.state)}</span></td><td data-l="설명">${inline(c.description, true)}</td><td data-l="시각" class="nowrap">${fmtTime(c.createdAt)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">이 단계의 체크포인트가 없습니다</td></tr>'}
    </tbody></table></section>
</main>`;
  }
  function actions(list) {
    return `<ul class="actions">${list.map((a) => `<li><div>${esc(a.text)}${a.user ? ' <span class="pill user">사용자</span>' : ''}</div>
      <div class="cmd"><code>${esc(a.command)}</code><button class="btn ghost small" data-copy="${esc(a.command)}">복사</button></div></li>`).join('')}</ul>`;
  }

  // ----- items -----
  function itemFilter(kind, params) {
    const q = (params.get('q') || '').toLowerCase();
    const tagSel = {};
    for (const t of params.getAll('tag')) { const k = t.indexOf(':'); if (k > 0) (tagSel[t.slice(0, k)] ||= []).push(t.slice(k + 1)); }
    const all = S.data.items.filter((x) => x.kind === kind).sort(byIdOrder);
    const hit = all.filter((x) => (!q || x.title.toLowerCase().includes(q) || dash(x.summary).toLowerCase().includes(q)) &&
      Object.entries(tagSel).every(([n, vals]) => tagsOf(x, n).some((v) => vals.includes(v))));
    // children right under their parent; a child whose parent is filtered out stays at its own place
    const ids = new Set(hit.map((x) => x.id));
    const ordered = [];
    for (const x of hit) {
      if (x.parent && ids.has(x.parent)) continue;
      ordered.push({ it: x, depth: 0 });
      const walk = (p, depth) => { for (const c of hit.filter((y) => y.parent === p.id)) { ordered.push({ it: c, depth }); walk(c, depth + 1); } };
      walk(x, 1);
    }
    return { all, ordered, q: params.get('q') || '', tagSel };
  }
  function screenItems(r) {
    const kind = r.arg || 'requirement';
    const model = KIND[kind];
    if (!model) return `<main class="page"><section class="card empty"><h2>없는 종류: ${esc(kind)}</h2><p><a href="#/items/requirement">요구사항 표로</a></p></section></main>`;
    S.lastKind = kind;
    const counts = Object.fromEntries(KINDS.map((k) => [k.kind, S.data.items.filter((x) => x.kind === k.kind).length]));
    const f = itemFilter(kind, r.params);
    return `<main class="page items">
  <aside class="kinds">
    <select data-act="kind" aria-label="종류">${KINDS.map((k) => `<option value="${k.kind}" ${k.kind === kind ? 'selected' : ''}>${esc(k.name)} (${counts[k.kind]})</option>`).join('')}</select>
    <ul>${KINDS.map((k) => `<li><a href="#/items/${k.kind}" class="${k.kind === kind ? 'on' : ''} ${counts[k.kind] ? '' : 'zero'}"><span>${esc(k.name)}</span><small>${counts[k.kind]}</small></a></li>`).join('')}</ul>
  </aside>
  <section class="itembox">
    <div class="ihead"><h2>${esc(model.name)}</h2><code class="muted">${kind}</code></div>
    <div class="toolbar">
      <input type="search" data-act="q" placeholder="제목 · 요약에서 찾기" value="${esc(f.q)}" aria-label="찾기">
      ${model.tags.map((t) => { const sel = f.tagSel[t.name] || []; return `<details class="filter ${sel.length ? 'set' : ''}"><summary>${esc(t.name)}${sel.length ? ': ' + esc(sel.join(', ')) : ''}</summary>
        <div class="menu">${t.values.map((v) => `<label><input type="checkbox" data-tag="${esc(t.name + ':' + v)}" ${sel.includes(v) ? 'checked' : ''}> ${esc(v)}</label>`).join('')}</div></details>`; }).join('')}
      <span class="count-badge" id="resultcount"></span>
      <a href="#/items/${kind}" class="clear" id="clearf" ${f.q || Object.keys(f.tagSel).length ? '' : 'hidden'}>거르기 지우기</a>
    </div>
    <div id="itemtable"></div>
  </section>
</main>`;
  }
  function renderItemTable() {
    const r = route(); const kind = r.arg || 'requirement'; const model = KIND[kind];
    const box = document.getElementById('itemtable'); if (!box || !model) return;
    const f = itemFilter(kind, r.params);
    document.getElementById('resultcount').textContent = `${f.ordered.length} / ${f.all.length}`;
    document.getElementById('clearf').hidden = !(f.q || Object.keys(f.tagSel).length);
    if (!f.all.length) { box.innerHTML = '<div class="empty">이 종류의 항목이 없습니다</div>'; return; }
    if (!f.ordered.length) { box.innerHTML = `<div class="empty">맞는 항목이 없습니다 · <a href="#/items/${kind}">거르기 지우기</a></div>`; return; }
    const tagCols = model.tags.map((t) => t.name);
    box.innerHTML = `<table class="rt items"><thead><tr><th>ID</th><th>제목</th><th>요약</th>${tagCols.map((t) => `<th>${esc(t)}</th>`).join('')}<th>체크포인트</th></tr></thead><tbody>
    ${f.ordered.map(({ it, depth }) => {
      const open = S.expanded.has(it.id);
      return `<tr class="row ${open ? 'open' : ''}" data-toggle="${esc(it.id)}">
        <td data-l="ID" class="nowrap" style="padding-left:${8 + depth * 18}px"><span class="caret">${open ? '▾' : '▸'}</span> <a href="#/item/${encodeURIComponent(it.id)}" class="iid">${esc(it.id)}</a></td>
        <td data-l="제목" class="ttl">${esc(it.title)}</td><td data-l="요약" class="muted">${esc(dash(it.summary))}</td>
        ${tagCols.map((t) => `<td data-l="${esc(t)}">${tagsOf(it, t).map((v) => `<span class="tag">${esc(v)}</span>`).join(' ')}</td>`).join('')}
        <td data-l="체크포인트" class="nowrap muted">${esc(it.checkpoint)}</td></tr>
      ${open ? `<tr class="bodyrow"><td colspan="${4 + tagCols.length}"><div class="md">${it.body ? markdown(it.body, { links: true }) : '<p class="muted">본문 없음</p>'}</div><a class="more" href="#/item/${encodeURIComponent(it.id)}">상세 보기 →</a></td></tr>` : ''}`;
    }).join('')}</tbody></table>`;
  }

  // ----- item detail -----
  function impactOf(id, maxDepth = 3) {
    const seen = new Map(); let frontier = [id];
    for (let depth = 1; depth <= maxDepth && frontier.length; depth++) {
      const next = [];
      for (const t of frontier) for (const [from, , to] of S.data.relations) if (to === t && from !== id && !seen.has(from)) { seen.set(from, depth); next.push(from); }
      frontier = next;
    }
    return Array.from(seen.entries()).sort((a, b) => a[1] - b[1] || byIdOrder({ id: a[0] }, { id: b[0] }));
  }
  function relGroups(list, key) {
    const g = new Map();
    for (const r of list) { if (!g.has(r[1])) g.set(r[1], []); g.get(r[1]).push(r[key]); }
    if (!g.size) return '<p class="muted">(없음)</p>';
    return Array.from(g.entries()).map(([name, ids]) => `<div class="relgroup"><div class="relname">${esc(name)} <small>${ids.length}</small></div><ul>${ids.sort().map((x) => `<li>${itemRef(x)}</li>`).join('')}</ul></div>`).join('');
  }
  function screenItem(r) {
    const it = byId.get(r.arg);
    if (!it) return `<main class="page"><section class="card empty"><h2>없는 항목: ${esc(r.arg)}</h2><p><a href="#/items/${S.lastKind || 'requirement'}">항목 표로</a></p></section></main>`;
    const model = KIND[it.kind];
    const outR = S.data.relations.filter((x) => x[0] === it.id);
    const inR = S.data.relations.filter((x) => x[2] === it.id);
    const kids = S.data.items.filter((x) => x.parent === it.id).sort(byIdOrder);
    const imp = impactOf(it.id);
    const isCR = it.kind === 'change_request';
    return `<main class="page detail">
  <div class="crumb"><a href="#/items/${it.kind}">${esc(model.name)}</a> ${it.parent ? `› ${itemLink(it.parent)}` : ''} › <b>${esc(it.id)}</b></div>
  <section class="card">
    <div class="cprow"><span class="iid big">${esc(it.id)}</span><span class="pill">${esc(model.name)}</span><span class="pill">${esc(it.checkpoint)}</span></div>
    <h1>${esc(it.title)}</h1>
    ${dash(it.summary) ? `<p class="summary">${esc(it.summary)}</p>` : ''}
    ${it.parent ? `<p class="muted">상위: ${itemRef(it.parent)}</p>` : ''}
    ${model.tags.length ? `<div class="tags">${model.tags.map((t) => `<div><span class="muted">${esc(t.name)}</span> ${tagsOf(it, t.name).map((v) => `<span class="tag">${esc(v)}</span>`).join(' ') || '<span class="muted">-</span>'}</div>`).join('')}</div>` : ''}
  </section>
  <div class="grid2 detailgrid">
    <section class="card md">${it.body ? markdown(it.body, { links: true }) : '<p class="muted">본문 없음</p>'}</section>
    <div>
      <section class="card"><h2>${isCR ? '영향 항목 (이 변경 요청이 가리키는 것)' : '이 항목이 가리키는 것'}</h2>${relGroups(outR, 2)}</section>
      <section class="card"><h2>이 항목을 가리키는 것</h2>${relGroups(inR, 0)}</section>
      <section class="card"><h2>영향 항목 <small class="muted">ks impact</small></h2>${imp.length ? `<ul class="impact">${imp.map(([x, dep]) => `<li><span class="depth">${dep}</span>${itemRef(x)}</li>`).join('')}</ul>` : '<p class="muted">(없음)</p>'}</section>
      <section class="card"><h2>하위 항목</h2>${kids.length ? `<ul class="plain">${kids.map((k) => `<li>${itemRef(k.id)}</li>`).join('')}</ul>` : '<p class="muted">(없음)</p>'}</section>
    </div>
  </div>
</main>`;
  }

  // ----- change requests -----
  function screenChanges() {
    const crs = S.data.items.filter((x) => x.kind === 'change_request').sort((a, b) => byIdOrder(b, a));
    if (!crs.length) return '<main class="page"><section class="card empty"><h2>변경 요청이 없습니다</h2></section></main>';
    const groups = CR_GROUPS.map((g) => ({ ...g, list: crs.filter((c) => tagsOf(c, '상태').some((v) => g.values.includes(v))) }));
    const known = CR_GROUPS.flatMap((g) => g.values);
    const none = crs.filter((c) => !tagsOf(c, '상태').some((v) => known.includes(v)));
    if (none.length) groups.push({ title: '상태 없음', list: none, open: true });
    const outCount = (id) => S.data.relations.filter((r) => r[0] === id).length;
    return `<main class="page">${groups.map((g) => `
  <details class="card group" ${g.open ? 'open' : ''}><summary><h2>${esc(g.title)} <span class="count-badge">${g.list.length}</span></h2></summary>
    ${g.list.length ? `<table class="rt"><thead><tr><th>ID</th><th>제목</th><th>상태</th><th>출처</th><th>진입 단계</th><th>영향 항목</th></tr></thead><tbody>
    ${g.list.map((c) => `<tr class="row" data-go="#/item/${encodeURIComponent(c.id)}" title="${esc(dash(c.summary))}"><td data-l="ID">${itemLink(c.id)}</td><td data-l="제목" class="ttl">${esc(c.title)}${dash(c.summary) ? `<div class="muted sm">${esc(c.summary)}</div>` : ''}</td>
      <td data-l="상태">${tagsOf(c, '상태').map((v) => `<span class="tag">${esc(v)}</span>`).join('')}</td><td data-l="출처">${esc(tagsOf(c, '출처').join(', '))}</td><td data-l="진입 단계">${esc(tagsOf(c, '진입 단계').join(''))}</td><td data-l="영향 항목">${outCount(c.id)}</td></tr>`).join('')}
    </tbody></table>` : '<p class="muted">(없음)</p>'}
  </details>`).join('')}</main>`;
  }

  // ---------- render ----------
  function render() {
    const r = route();
    if (S.demo === 'nowasm') {
      app.innerHTML = header('') + `<main class="page narrow"><section class="card empty"><h2>이 브라우저에서는 열 수 없습니다</h2><p>WebAssembly 를 지원하는 브라우저가 필요합니다.</p><ul><li>Windows · macOS 의 크롬 · 엣지 최신 두 주 버전</li><li>macOS 의 사파리 최신 두 주 버전</li></ul></section></main>` + demoBar();
      return;
    }
    let screen = r.screen;
    if (!S.data && !S.loading) screen = 'open';
    if (S.loading && !S.data) screen = 'open';
    let main;
    switch (screen) {
      case 'open': main = screenOpen(); break;
      case 'overview': main = screenOverview(); break;
      case 'items': main = screenItems(r); break;
      case 'item': main = screenItem(r); break;
      case 'changes': main = screenChanges(); break;
      default: screen = 'progress'; main = screenProgress();
    }
    app.innerHTML = header(screen) + main + specPanel(screen) + demoBar();
    if (screen === 'items') renderItemTable();
    document.title = `kiotty-spec 뷰어 · ${({ open: '열기', overview: '개요', progress: '진행', items: '항목', item: r.arg, changes: '변경 요청' })[screen] || ''}`;
  }

  // ---------- events ----------
  window.addEventListener('hashchange', () => {
    const r = route();
    if (r.screen !== 'open') S.error = null;
    if (r.screen === 'item' || r.screen !== 'items') window.scrollTo(0, 0);
    render();
  });
  app.addEventListener('click', (e) => {
    const t = e.target;
    const spec = t.closest('[data-spec]');
    if (spec) { e.preventDefault(); S.specOpen = true; S.specTab = spec.dataset.spec; render(); return; }
    const act = t.closest('[data-act="spec"]');
    if (act) { S.specOpen = !S.specOpen; S.specTab = null; render(); return; }
    const copy = t.closest('[data-copy]');
    if (copy) { (navigator.clipboard ? navigator.clipboard.writeText(copy.dataset.copy) : Promise.reject()).then(() => toast('복사했습니다'), () => toast('복사하지 못했습니다', true)); return; }
    if (t.closest('a')) return;
    const tog = t.closest('[data-toggle]');
    if (tog) { const id = tog.dataset.toggle; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); renderItemTable(); return; }
    const row = t.closest('[data-go]');
    if (row) go(row.dataset.go);
  });
  app.addEventListener('change', (e) => {
    const t = e.target; const r = route();
    if (t.dataset.act === 'demo') { S.demo = t.value; if (S.data || t.value !== 'nowasm') load(S.source || { repo: DUMMY.source.repo, ref: DUMMY.source.ref, path: DUMMY.source.path }, 200); else render(); return; }
    if (t.dataset.act === 'kind') { go(`#/items/${t.value}`); return; }
    if (t.dataset.act === 'cpstep') { S.cpStep = t.value; render(); return; }
    if (t.dataset.act === 'file') { openFiles(t.files); return; }
    if (t.dataset.tag !== undefined) {
      const tags = new Set(r.params.getAll('tag'));
      t.checked ? tags.add(t.dataset.tag) : tags.delete(t.dataset.tag);
      history.replaceState(null, '', itemsHash(r.arg, r.params.get('q') || '', tags));
      const det = t.closest('details');
      const name = t.dataset.tag.split(':')[0];
      const sel = Array.from(det.querySelectorAll('input:checked')).map((x) => x.dataset.tag.slice(name.length + 1));
      det.querySelector('summary').textContent = name + (sel.length ? ': ' + sel.join(', ') : '');
      det.classList.toggle('set', sel.length > 0);
      renderItemTable();
    }
  });
  app.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.act === 'q') { const r = route(); history.replaceState(null, '', itemsHash(r.arg, t.value, r.params.getAll('tag'))); renderItemTable(); }
  });
  app.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const repo = String(fd.get('repo') || '').trim(); const ref = String(fd.get('ref') || '').trim(); const p = String(fd.get('path') || '').trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { document.getElementById('formerr').textContent = 'OWNER/NAME 꼴로 입력하세요'; return; }
    openRemote(repo, ref, p);
  });
  document.addEventListener('click', (e) => { for (const d of document.querySelectorAll('details.filter[open]')) if (!d.contains(e.target)) d.open = false; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.specOpen) { S.specOpen = false; render(); } });
  // drop anywhere opens a file
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); openFiles(e.dataTransfer.files); });

  // Start as if the link ?repo=acme/memo-sync&ref=v0.3.0 was opened.
  if (route().screen === 'open') render();
  else load({ repo: DUMMY.source.repo, ref: DUMMY.source.ref, path: DUMMY.source.path });
})();

</script>
</body>
</html>
