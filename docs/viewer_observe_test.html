<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ks viewer — 파일 관찰 시험</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #ccc; padding: 3px 8px; text-align: left; }
  .ok { color: #16794c; font-weight: 600; } .no { color: #b3261e; font-weight: 600; }
  button { margin: 2px 4px 2px 0; padding: 4px 10px; }
  #state { padding: 8px; background: #f3f5f8; border-radius: 6px; }
  #log { font: 12px/1.45 ui-monospace, Consolas, monospace; background: #111; color: #ddd; padding: 8px; height: 320px; overflow: auto; white-space: pre-wrap; border-radius: 6px; }
  .muted { color: #777; }
</style>
</head>
<body>
<h1>ks viewer — 파일 관찰 시험</h1>
<p class="muted">.kiotty/spec.kisp 를 연 뒤 AI(또는 ks)로 파일을 바꾸고, 로그에 변경이 언제 · 어느 방식으로 잡히는지 본다. 이 페이지는 파일에 쓰지 않는다.</p>

<h2>1. 기능 감지</h2>
<table id="caps"></table>

<h2>2. 열기</h2>
<div>
  <button id="pick">파일 열기 (핸들)</button>
  <b>또는 spec.kisp 를 이 페이지에 끌어다 놓기</b>
  <button id="restore">저장된 핸들로 다시 열기</button>
  <label id="inputWrap">(핸들이 없는 브라우저용) <input type="file" id="input"></label>
</div>
<div>
  <label><input type="radio" name="mode" value="auto" checked> 자동 (옵저버 → 폴링 → 수동)</label>
  <label><input type="radio" name="mode" value="poll"> 폴링 강제</label>
  <label><input type="radio" name="mode" value="both"> 옵저버 + 폴링 동시 (지연 비교)</label>
</div>
<div>
  <button id="reload">다시 읽기</button>
  <button id="perm">쓰기 권한 요청만 해 보기</button>
  <button id="stop">관찰 중지</button>
  <button id="clear">로그 지우기</button>
</div>

<h2>3. 상태</h2>
<div id="state">열린 파일 없음</div>

<h2>4. 로그</h2>
<div id="log"></div>

<script>
'use strict';
// ---------- log ----------
// 로그는 sessionStorage 에 남겨 새로고침이 끼어들어도 이어서 보인다.
const LOG_KEY = 'ks-viewer-test-log';
const logEl = document.getElementById('log');
logEl.textContent = sessionStorage.getItem(LOG_KEY) || '';
function log(src, msg) {
  const now = new Date();
  const ts = now.toTimeString().slice(0, 8) + '.' + String(now.getMilliseconds()).padStart(3, '0');
  logEl.textContent += `${ts}  [${src}] ${msg}\n`;
  sessionStorage.setItem(LOG_KEY, logEl.textContent);
  logEl.scrollTop = logEl.scrollHeight;
}

// ---------- capabilities ----------
const CAPS = {
  'isSecureContext': window.isSecureContext,
  'showOpenFilePicker': 'showOpenFilePicker' in window,
  'FileSystemObserver': 'FileSystemObserver' in window,
  'indexedDB': 'indexedDB' in window,
  'FileSystemHandle.queryPermission': typeof FileSystemHandle !== 'undefined' && 'queryPermission' in FileSystemHandle.prototype,
};
document.getElementById('caps').innerHTML =
  Object.entries(CAPS).map(([k, v]) => `<tr><td>${k}</td><td class="${v ? 'ok' : 'no'}">${v ? '있음' : '없음'}</td></tr>`).join('') +
  `<tr><td>userAgent</td><td class="muted">${navigator.userAgent}</td></tr>`;

// ---------- content summary ----------
function fnv1a(bytes) {
  let h = 0x811c9dc5;
  for (let i = 0; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}
async function summarize(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  let lines = 0; for (const b of bytes) if (b === 10) lines++;
  return { name: file.name, size: file.size, lastModified: file.lastModified, lines, hash: fnv1a(bytes) };
}
function fmt(s) { return `${s.name} · ${s.size} B · ${s.lines} 줄 · hash ${s.hash} · lastModified ${new Date(s.lastModified).toLocaleTimeString()}`; }

// ---------- FileWatcher abstraction ----------
// createFileWatcher(source, onChange, { mode }) -> { mode, stop() }
//   source: FileSystemFileHandle 또는 File
//   onChange(File, via): 내용이 바뀌었을 때 (lastModified · size 기준)
//   mode: 'auto' | 'poll' | 'both'
// 뷰어 본체는 이 함수만 쓰고, 어느 방식인지는 신경 쓰지 않는다.
function createFileWatcher(source, onChange, opts = {}) {
  const want = opts.mode || 'auto';
  const isHandle = typeof FileSystemFileHandle !== 'undefined' && source instanceof FileSystemFileHandle;
  const stops = [];
  let last = null; // { lastModified, size }
  let busy = false;

  async function check(via) {
    if (busy) return; busy = true;
    try {
      const f = await source.getFile();
      const sig = { lastModified: f.lastModified, size: f.size };
      if (!last || sig.lastModified !== last.lastModified || sig.size !== last.size) {
        const first = !last; last = sig;
        if (!first) onChange(f, via);
      }
    } catch (e) {
      log(via, `읽기 실패: ${e.name} ${e.message}`);
    } finally { busy = false; }
  }

  const modes = [];
  if (isHandle) {
    check('init');
    const canObserve = 'FileSystemObserver' in window;
    if ((want === 'auto' || want === 'both') && canObserve) {
      const obs = new FileSystemObserver((records) => {
        for (const r of records) log('observer', `record type=${r.type} path=${(r.relativePathComponents || []).join('/') || '(self)'}`);
        if (records.some((r) => r.type === 'errored')) log('observer', 'errored 레코드 — 폴링으로 넘어가야 함');
        check('observer');
      });
      obs.observe(source).then(
        () => log('observer', '관찰 시작'),
        (e) => log('observer', `observe 실패: ${e.name} ${e.message}`));
      stops.push(() => obs.disconnect());
      modes.push('observer');
    }
    if (want === 'poll' || want === 'both' || !canObserve) {
      const id = setInterval(() => check('poll'), 1000);
      stops.push(() => clearInterval(id));
      modes.push('poll');
    }
  } else {
    // File 스냅숏: 원칙상 바뀌지 않는다. 정말 그런지 시험한다.
    let lm = source.lastModified, size = source.size;
    const id = setInterval(async () => {
      try {
        await source.slice(0, 1).arrayBuffer();
        if (source.lastModified !== lm || source.size !== size) {
          lm = source.lastModified; size = source.size;
          onChange(source, 'snapshot');
        }
      } catch (e) {
        log('snapshot', `읽기 실패 (${e.name}) — 파일이 바뀌었다는 신호일 수 있음. 다시 골라야 함`);
        clearInterval(id);
      }
    }, 1000);
    stops.push(() => clearInterval(id));
    modes.push('manual');
  }
  return { mode: modes.join('+'), stop() { stops.forEach((s) => s()); } };
}

// ---------- page wiring ----------
let current = null;   // FileSystemFileHandle | File
let watcher = null;
const stateEl = document.getElementById('state');
const modeSel = () => document.querySelector('input[name=mode]:checked').value;

async function show(file, via) {
  const s = await summarize(file);
  stateEl.textContent = `[${watcher ? watcher.mode : '-'}] ${fmt(s)}`;
  log(via, fmt(s));
}
async function open(source, via) {
  if (watcher) watcher.stop();
  current = source;
  const file = source.getFile ? await source.getFile() : source;
  watcher = createFileWatcher(source, (f, v) => show(f, v), { mode: modeSel() });
  log(via, `열기 — 관찰 방식: ${watcher.mode}`);
  await show(file, via);
}

// IndexedDB 에 핸들 보관 (다음 방문 때 다시 고르지 않기)
function idb() {
  return new Promise((ok, ng) => {
    const r = indexedDB.open('ks-viewer-test', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
  });
}
async function saveHandle(h) {
  const db = await idb();
  await new Promise((ok, ng) => { const tx = db.transaction('h', 'readwrite'); tx.objectStore('h').put(h, 'spec'); tx.oncomplete = ok; tx.onerror = () => ng(tx.error); });
}
async function loadHandle() {
  const db = await idb();
  return new Promise((ok, ng) => { const r = db.transaction('h').objectStore('h').get('spec'); r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); });
}

document.getElementById('pick').onclick = async () => {
  if (!CAPS.showOpenFilePicker) { log('pick', 'showOpenFilePicker 없음 — 아래 파일 입력을 쓴다'); return; }
  try {
    const [h] = await window.showOpenFilePicker();  // 필터 없음 — 모든 파일이 보인다
    try { await saveHandle(h); log('pick', '핸들을 IndexedDB 에 저장함'); } catch (e) { log('pick', `핸들 저장 실패: ${e.name} ${e.message}`); }
    await open(h, 'pick');
  } catch (e) { log('pick', `${e.name} ${e.message}`); }
};
document.getElementById('restore').onclick = async () => {
  try {
    const h = await loadHandle();
    if (!h) { log('restore', '저장된 핸들 없음'); return; }
    let p = await h.queryPermission({ mode: 'read' });
    log('restore', `읽기 권한: ${p}`);
    if (p !== 'granted') { p = await h.requestPermission({ mode: 'read' }); log('restore', `요청 결과: ${p}`); }
    if (p === 'granted') await open(h, 'restore');
  } catch (e) { log('restore', `${e.name} ${e.message}`); }
};
// 끌어다 놓기: 크로미움에서는 getAsFileSystemHandle() 로 핸들을 받는다 (선택 창을 거치지 않음)
document.addEventListener('dragover', (ev) => ev.preventDefault());
document.addEventListener('drop', async (ev) => {
  ev.preventDefault();
  const item = [...ev.dataTransfer.items].find((i) => i.kind === 'file');
  if (!item) return;
  try {
    if (item.getAsFileSystemHandle) {
      const h = await item.getAsFileSystemHandle();
      if (h && h.kind === 'file') {
        try { await saveHandle(h); } catch (e) { log('drop', `핸들 저장 실패: ${e.name}`); }
        await open(h, 'drop'); return;
      }
      log('drop', `핸들이 파일이 아님: ${h && h.kind}`);
    }
    await open(item.getAsFile(), 'drop-file');
  } catch (e) { log('drop', `${e.name} ${e.message}`); }
});
document.getElementById('input').onchange = (ev) => { const f = ev.target.files[0]; if (f) open(f, 'input'); };
document.getElementById('reload').onclick = async () => {
  if (!current) return;
  try { await show(current.getFile ? await current.getFile() : current, 'reload'); }
  catch (e) { log('reload', `${e.name} ${e.message} — 파일 입력으로 다시 골라야 함`); }
};
document.getElementById('perm').onclick = async () => {
  if (!current || !current.requestPermission) { log('perm', '핸들로 연 파일이 아님'); return; }
  try { log('perm', `쓰기 권한(readwrite): ${await current.requestPermission({ mode: 'readwrite' })} — 실제로 쓰지는 않음`); }
  catch (e) { log('perm', `${e.name} ${e.message}`); }
};
document.getElementById('stop').onclick = () => { if (watcher) { watcher.stop(); log('stop', '관찰 중지'); watcher = null; } };
document.getElementById('clear').onclick = () => { logEl.textContent = ''; sessionStorage.removeItem(LOG_KEY); };

// 핸들을 쓸 수 있으면 파일 입력은 숨긴다 (헷갈려서 manual 로 열리는 것을 막는다)
if (CAPS.showOpenFilePicker) document.getElementById('inputWrap').style.display = 'none';
const nav = (performance.getEntriesByType('navigation')[0] || {}).type || '?';
log('init', `페이지 로드 (navigation=${nav}) — secure=${CAPS.isSecureContext} picker=${CAPS.showOpenFilePicker} observer=${CAPS.FileSystemObserver}`);

// 새로고침 뒤 저장된 핸들을 자동으로 다시 연다. 권한이 'prompt' 면 사용자 클릭이 필요하다.
(async () => {
  if (!CAPS.showOpenFilePicker) return;
  try {
    const h = await loadHandle();
    if (!h) return;
    const p = await h.queryPermission({ mode: 'read' });
    if (p === 'granted') await open(h, 'auto-restore');
    else log('auto-restore', `읽기 권한 ${p} — "저장된 핸들로 다시 열기" 를 눌러야 함`);
  } catch (e) { log('auto-restore', `${e.name} ${e.message}`); }
})();
</script>
</body>
</html>
